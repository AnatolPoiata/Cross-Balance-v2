[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-balance"
version = "0.2.0"
description = "Cross-Balance: a chunked-partition ensemble method for imbalanced binary classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "imbalanced-learn",
    "scipy",
]

[project.optional-dependencies]
boost = ["xgboost", "lightgbm"]
nn = ["torch"]
plot = ["matplotlib"]
bench = ["pyarrow", "xlrd"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/cross_balance"]
